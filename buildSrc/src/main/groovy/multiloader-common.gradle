plugins {
    id 'java-library'
}

def modName = providers.gradleProperty('mod_name').get()
def modAuthor = providers.gradleProperty('mod_author').get()
def minecraftVersion = providers.gradleProperty('minecraft_version').get()

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { original -> "${original}_${modName}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { original -> "${original}_${modName}" }
    }
    manifest {
        attributes([
                'Specification-Title'     : modName,
                'Specification-Vendor'    : modAuthor,
                'Specification-Version'   : project.jar.archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : modAuthor,
                'Built-On-Minecraft'      : minecraftVersion
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var expandProps = [
            version                         : version,
            group                           : project.group,
            minecraft_version               : minecraft_version,
            minecraft_version_range         : minecraft_version_range,
            fabric_loader_version           : fabric_loader_version,
            fabric_api_version              : fabric_api_version,
            fabric_kotlin_version           : fabric_kotlin_version,
            mod_name                        : mod_name,
            mod_author                      : mod_author,
            mod_id                          : mod_id,
            license                         : mod_license,
            description                     : mod_description,
            neoforge_version                : neoforge_version,
            neoforge_loader_version_range   : neoforge_loader_version_range,
            kotlin_for_forge_version        : kotlin_for_forge_version,
            credits                         : credits,
            java_version                    : java_version,
            cobblemon_min_version           : cobblemon_min_version
    ]
    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
